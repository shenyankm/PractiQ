global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: openwook-web
    metrics_path: /api/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: ${METRICS_TOKEN}
    static_configs:
      - targets:
          - 127.0.0.1:3000
          - 127.0.0.1:3001
          - 127.0.0.1:3002
          - 127.0.0.1:3003

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']

  - job_name: postgres
    static_configs:
      - targets: ['127.0.0.1:9187']

  - job_name: redis
    static_configs:
      - targets: ['127.0.0.1:9121']

[SERVICE]
    Flush        1
    Log_Level    info

[INPUT]
    Name         systemd
    Tag          journald.openwook
    Systemd_Filter _SYSTEMD_UNIT=openwook.service
    Systemd_Filter _SYSTEMD_UNIT=openwook-import-worker.service
    Read_From_Tail On

[INPUT]
    Name         tail
    Tag          caddy.openwook
    Path         /var/log/caddy/openwook-access.log
    Parser       json
    Read_from_Head false

[OUTPUT]
    Name         stdout
    Match        *

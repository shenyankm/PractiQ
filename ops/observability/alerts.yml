groups:
  - name: openwook.rules
    rules:
      - alert: OpenWookHighHttp5xxRate
        expr: |
          sum(rate(openwook_http_requests_total{status=~"5.."}[5m]))
          /
          clamp_min(sum(rate(openwook_http_requests_total[5m])), 1) > 0.01
        for: 5m
        labels:
          severity: page
        annotations:
          summary: OpenWook HTTP 5xx rate is above 1%

      - alert: OpenWookHighP95Latency
        expr: |
          histogram_quantile(0.95, sum by (le, route, method) (rate(openwook_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warn
        annotations:
          summary: OpenWook p95 latency is above 2 seconds

      - alert: OpenWookDependencyErrors
        expr: sum(rate(openwook_dependency_errors_total[5m])) by (dependency, operation) > 0
        for: 5m
        labels:
          severity: warn
        annotations:
          summary: OpenWook dependency errors detected

      - alert: OpenWookImportFailures
        expr: sum(rate(openwook_import_jobs_total{status="failed"}[10m])) > 0
        for: 1m
        labels:
          severity: warn
        annotations:
          summary: OpenWook import worker is failing jobs

      - alert: OpenWookImportQueueBacklog
        expr: sum(openwook_import_queue_jobs{state=~"waiting|delayed|prioritized|waiting-children"}) > 100
        for: 15m
        labels:
          severity: warn
        annotations:
          summary: OpenWook import queue backlog is growing

[package]
name = "practiq-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "PractiQ"
path = "src/main.rs"

[lib]
name = "practiq_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
jsonschema = { version = "0.33", default-features = false }
sha2 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
zip = { version = "4", default-features = false, features = ["deflate"] }

tempfile = "3"
tauri-plugin-single-instance = "2"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "mp3", "isomp4", "wav", "pcm", "alac", "id3v2"] }
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[profile.release]
lto = "thin"
strip = "symbols"

# GTK3 requires glib 0.18; backport the upstream VariantStrIter safety fix.
[patch.crates-io]
glib = { path = "vendor/glib" }

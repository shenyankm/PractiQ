services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: practiq_app
      POSTGRES_USER: practiq
      POSTGRES_PASSWORD: practiq
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

  redis:
    image: redis:7-alpine
    command:
      [
        "redis-server",
        "--appendonly",
        "yes",
        "--save",
        "60",
        "1000",
        "--maxmemory-policy",
        "noeviction",
      ]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: on-failure

  ai:
    image: practiq-ai:latest
    build:
      context: .
      dockerfile: Dockerfile.server
    env_file:
      - path: .env.local
        required: false
    environment:
      AI_HOST: 0.0.0.0
      AI_PORT: 8080
    ports:
      - "127.0.0.1:8081:8080"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health/live').read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: on-failure

volumes:
  postgres-data:
  redis-data:

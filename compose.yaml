services:
  personal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: practiq_personal
      POSTGRES_USER: practiq
      POSTGRES_PASSWORD: practiq
    ports:
      - "127.0.0.1:54322:5432"
    volumes:
      - personal-postgres-data:/var/lib/postgresql/data
      - ./db/00_schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practiq -d practiq_personal"]
      interval: 5s
      timeout: 5s
      retries: 10
# Separate volume: previous postgres-data and redis-data volumes are never reused or removed.
volumes:
  personal-postgres-data:

name: Bug report
description: Report incorrect behavior or a specific parsing or grading result
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English and search [existing issues](https://github.com/shenyankm/PractiQ/issues) first. Link a related report instead of opening a duplicate.
        Remove tokens, API keys, personal learning data, and private document content from text and attachments. Report suspected vulnerabilities through [SECURITY.md](https://github.com/shenyankm/PractiQ/blob/main/SECURITY.md).

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Practice app - macOS or Windows
        - Practice app - Android
        - Import Web frontend
        - AI service or document processing
        - Build, CI, or packaging
        - Documentation
        - Multiple areas or not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or revision
      description: Give the affected app version and/or service commit or tag. For documentation, give the page URL. If the version is unknown, say how you obtained PractiQ; include an image digest if relevant.
      placeholder: "App version; service commit/tag; or Unknown - installation source"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact. Mention frequency, a last working version, or a workaround if known.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Give the smallest reproduction. Distinguish Web source-document import, app bank ZIP import, and full learning-data restoration. For an intermittent problem, describe the conditions and what you tried.
      placeholder: |
        Entry point and input type:
        1. Open...
        2. Select or run...
        3. Observe...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the expected observable result. For content-quality problems, include one concrete expected-versus-actual example below.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include OS/version and architecture. For Android, add device or emulator and System WebView version; for Web, browser/version; for source or service issues, relevant runtime/container and LibreOffice versions. Explain unknown or non-applicable details.
      placeholder: |
        OS/version and architecture:
        Run mode (installed app / source / Web / service container):
        Relevant device, browser, WebView, or runtime details:
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or minimal sample
      description: Attach sanitized evidence if available. Put logs in fenced code blocks. Use a small synthetic sample that you may share; a private source document or learning database is not required.

  - type: textarea
    id: ai_context
    attributes:
      label: Parsing or grading context
      description: For parsing or grading problems, include the known details below. You do not need to make another paid model call to complete this form.
      placeholder: |
        Operation and failing stage:
        Task/request ID and error code, if available:
        Provider and model ID (no credentials):
        Input format, size, page/sheet count, and text or scanned content:
        Small source excerpt, actual output, and expected output:
        Supplied reference answer or rubric, for grading:

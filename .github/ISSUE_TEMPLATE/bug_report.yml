name: Bug report
description: Report reproducible incorrect behavior in PractiQ
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search [existing issues](https://github.com/shenyankm/PractiQ/issues) before submitting. Do not include credentials, tokens, personal data, or working exploit details.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Python AI service (`server/`)
        - Documentation
        - Build or development tooling
        - Multiple areas
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: List the smallest sequence that reproduces the problem, including relevant inputs.
      placeholder: |
        1. Start…
        2. Open…
        3. Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the expected outcome.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the commit, operating system, runtime versions, browser or WeChat Developer Tools version, and deployment mode when relevant.
      placeholder: |
        Commit:
        OS:
        Python/Node version:
        WeChat Developer Tools version:
        Local, staging, or production:

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or other evidence
      description: Add sanitized logs, request IDs, screenshots, or recordings. Remove tokens, API keys, personal data, and private document content.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Note regressions, workarounds, frequency, or related issues.

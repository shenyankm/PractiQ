name: Bug report
description: Report reproducible incorrect behavior in PractiQ
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Search [existing issues](https://github.com/shenyankm/PractiQ/issues) before submitting. Do not include credentials, tokens, personal data, or working exploit details.
        For suspected vulnerabilities, follow [SECURITY.md](https://github.com/shenyankm/PractiQ/blob/main/SECURITY.md) and use its private reporting entry instead of this public form.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Python AI service (`server/`)
        - Import Web frontend (`web/`)
        - Practice application (`app/`, macOS/Windows/Android)
        - Documentation
        - Build or development tooling
        - Multiple areas
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: List the smallest sequence that reproduces the problem. For import issues, distinguish source-document parsing, bank ZIP import, and full backup restoration. Include file format, size, page count where applicable, and a sanitized minimal sample if available.
      placeholder: |
        1. Start…
        2. Open…
        3. Observe…
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: Describe the expected outcome.
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the app version or commit, OS version and CPU architecture, and how you run PractiQ. Runtime versions are only needed for development or independent-service issues. Use N/A for unrelated fields or explain unknown values.
      placeholder: |
        App version or commit:
        OS version and CPU architecture:
        Installed desktop app, desktop from source, or independent AI service:
        Python/Node/Rust versions (if relevant):
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs, screenshots, or other evidence
      description: Add sanitized logs, screenshots, or recordings. For parsing or grading issues, include the task/request ID, error code, model ID, and failing stage when available. For result-quality issues, show a specific expected-versus-actual example. Remove tokens, API keys, personal data, and private document content; a full private document is not required.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Note regressions, workarounds, frequency, or related issues.

name: Feature request
description: Propose an improvement to PractiQ's desktop app, import Web frontend, AI service, or development workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search [existing issues](https://github.com/shenyankm/PractiQ/issues) and review the relevant sections of [README.md](https://github.com/shenyankm/PractiQ/blob/main/README.md) before proposing a feature. Describe the need before prescribing an implementation.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: I reviewed the relevant sections of `README.md`.
          required: true

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Python AI service (`server/`)
        - Import Web frontend (`web/`)
        - Desktop application (`app/`)
        - Documentation
        - Build or development tooling
        - Cross-layer feature
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe who is affected, the current limitation, and why it matters.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: What outcome do you want?
      description: Describe observable behavior and acceptance criteria without assuming a specific implementation.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe an implementation only if you have one. For technical proposals, consult AGENTS.md and the relevant architecture documentation, and reuse existing components. Document parsing and explicit AI grading belong in the existing service; practice remains offline.

  - type: textarea
    id: impact
    attributes:
      label: Scope and impact
      description: Note API, storage, security, privacy, configuration, or deployment implications.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: List existing behavior, workarounds, or smaller options you considered.

  - type: dropdown
    id: contribution
    attributes:
      label: Are you willing to implement this?
      options:
        - "Yes"
        - "No"
        - I can help with part of it

name: Feature request
description: Propose an improvement to the practice app, import Web frontend, service, or tooling
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English. Search [existing issues](https://github.com/shenyankm/PractiQ/issues) and read the relevant [README](https://github.com/shenyankm/PractiQ/blob/main/README.md) sections first.
        Start with the user's problem and desired outcome. Technical proposals should follow [AGENTS.md](https://github.com/shenyankm/PractiQ/blob/main/AGENTS.md): practice stays offline; document parsing and explicit AI grading use the independent service.

  - type: dropdown
    id: area
    attributes:
      label: Primary area
      options:
        - Practice app - macOS or Windows
        - Practice app - Android
        - Import Web frontend
        - AI service or document processing
        - Shared UI or data contracts
        - Build, CI, or packaging
        - Documentation
        - Multiple areas or not sure
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Explain who is affected, what they are trying to do, and the limitation in the current behavior.
    validations:
      required: true

  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome and acceptance criteria
      description: Describe observable behavior that would make this improvement complete. Include important boundaries or cases that should keep working.
      placeholder: |
        Desired behavior:
        - ...
        Acceptance examples:
        - Given ..., when ..., then ...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Possible approach and alternatives
      description: If you have an implementation idea, explain it and any simpler alternative or workaround. An implementation proposal is not required.

  - type: textarea
    id: impact
    attributes:
      label: Scope and impact
      description: Note known platform, API, data/backup, configuration, dependency, accessibility, or deployment effects. For AI work, explain any new explicit action, provider cost, or recovery behavior. Unknown details are acceptable.

  - type: dropdown
    id: contribution
    attributes:
      label: How could you help?
      description: Optional. Proposing a feature does not commit you to implementing it.
      options:
        - I can help implement it
        - I can help test or provide examples
        - I am proposing it for discussion

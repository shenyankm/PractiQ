version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directories: [/app]
    schedule:
      interval: weekly
    groups:
      math-renderer:
        patterns: [katex, rehype-katex, micromark-extension-math, mdast-util-math, remark-math]
      shared-dependencies:
        group-by: dependency-name
        patterns: ["*"]
    open-pull-requests-limit: 2

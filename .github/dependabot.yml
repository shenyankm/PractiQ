version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 2
  - package-ecosystem: npm
    directories: [/app, /web]
    schedule:
      interval: weekly
    groups:
      math-renderer:
        patterns: [katex, rehype-katex, micromark-extension-math, mdast-util-math, remark-math]
      shared-dependencies:
        group-by: dependency-name
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: cargo
    directory: /app/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: gradle
    directory: /app/src-tauri/gen/android
    schedule:
      interval: weekly
    open-pull-requests-limit: 1
  - package-ecosystem: docker
    # Multi-stage runtime bases still require the documented manual update route.
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

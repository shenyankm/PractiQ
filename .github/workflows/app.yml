name: Practice App
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable full commit SHA; defaults to the event commit
        type: string
        default: ''
      release:
        type: boolean
        default: false
      tag:
        type: string
        default: ''
concurrency:
  group: app-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
      sha: ${{ inputs.ref || github.sha }}
    steps:
      - name: Validate immutable source revision
        id: validate-source
        env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Source revision must be a full commit SHA.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL_CHECKS: ${{ inputs.ref != '' }}
        run: python server/scripts/ci_scope.py scope desktop
  quality:
    name: App quality
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          key: quality
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install locked service dependencies for contract checks
        run: make install-locked AI_PYTHON=python
      - run: python app/scripts/export-contracts.py --check
      - run: python app/scripts/check-fixtures.py
      - run: python -m pytest server/tests/test_ci.py server/tests/test_ci_scope.py server/tests/test_release_checks.py server/tests/test_release_workflow.py server/tests/test_desktop_package.py
        env:
          PRACTIQ_REQUIRE_NATIVE_BUILD_GUARD: '1'
      - run: npm ci
        working-directory: app
      - name: Check frontend types, lint and coverage
        env:
          VITEST_MAX_WORKERS: '2'
        working-directory: app
        run: npm run check:ui
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: app
      - run: npm run test:browser
        working-directory: app
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-browser
          path: app/test-results/browser/
          retention-days: 7
      - run: npm audit --audit-level=high
        working-directory: app
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - name: Install pinned Rust advisory checker
        run: cargo install cargo-audit --locked --version 0.22.2 --registry crates-io
      - run: make audit-rust
      - name: Upload frontend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-coverage
          path: coverage/app/
          retention-days: 7
  package:
    name: macOS package
    needs: [changes, quality]
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
        working-directory: app
      - name: Verify Rust flows and lint
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: |
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: python app/scripts/prepare-package.py
      - run: npm run tauri -- build
        working-directory: app
      - name: Verify packaged macOS desktop payload
        run: python app/scripts/check-installer.py --installer app/src-tauri/target/release/bundle/dmg/*.dmg --output server/reports/checks/desktop-bundle.json
      - name: Archive macOS application
        if: github.event_name != 'pull_request'
        run: ditto -c -k --keepParent app/src-tauri/target/release/bundle/macos/PractiQ.app app/PractiQ-macOS.zip
      - name: Verify final installer and stage release assets
        if: inputs.release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python app/scripts/release.py stage --tag "$RELEASE_TAG"
      - name: Upload gated release assets
        if: inputs.release
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macOS
          path: app/.build/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Upload package verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-checks-macOS
          path: |
            server/reports/checks/desktop-bundle.json
            server/reports/checks/release/
            app/src-tauri/bundled/build-manifest.json
            app/src-tauri/bundled/THIRD-PARTY.txt
          retention-days: 7
      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: PractiQ-macOS
          path: |
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/PractiQ-macOS.zip
          if-no-files-found: error
          retention-days: 14
  desktop-gate:
    name: Desktop CI
    needs: [changes, quality, package]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Require validated source
        id: source-ready
        env:
          SOURCE_STATUS: ${{ needs.changes.result }}
        run: test "$SOURCE_STATUS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python server/scripts/ci_scope.py gate desktop

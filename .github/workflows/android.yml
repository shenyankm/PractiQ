name: Android
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
      release:
        type: boolean
        default: false
      tag:
        type: string
        default: ''
concurrency:
  group: android-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL_CHECKS: ${{ inputs.ref != '' }}
        run: python server/scripts/ci_scope.py scope android
  quality:
    name: Android quality
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: make install-locked AI_PYTHON=python
      - run: python app/scripts/export-contracts.py --check
      - run: python app/scripts/check-fixtures.py
      - run: python -m pytest server/tests/test_android_package.py server/tests/test_android_licenses.py server/tests/test_release_checks.py server/tests/test_release_workflow.py server/tests/test_ci.py server/tests/test_ci_scope.py
      - run: npm ci
        working-directory: app
      - run: npm run check:ui
        working-directory: app
        env:
          VITEST_MAX_WORKERS: '2'
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: app
      - run: npm run test:android-browser
        working-directory: app
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: android-browser-and-coverage
          path: |
            app/test-results/browser/
            coverage/app/
          retention-days: 7
  package:
    name: Android arm64 APK
    needs: [changes, quality]
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Select the pinned native toolchain
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: rustup target add aarch64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          key: android-arm64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
        working-directory: app
      - name: Resolve native Android projects without distributable resources
        working-directory: app
        run: npm run tauri -- android build --debug --apk --split-per-abi --target aarch64 --ci --config '{"bundle":{"resources":[]}}'
      - name: Bind notices to the locked actual runtime
        run: |
          app/src-tauri/gen/android/gradlew -p app/src-tauri/gen/android :app:exportRuntimeNoticeInventory -PpractiqNoticeConfiguration=arm64DebugRuntimeClasspath -PpractiqNoticeOutput="$PWD/app/.build/android-runtime.json" --no-daemon
          python app/scripts/prepare-package.py --platform android --architecture arm64 --android-runtime-inventory app/.build/android-runtime.json
      - name: Build the final practice-client APK
        working-directory: app
        run: npm run tauri -- android build --debug --apk --split-per-abi --target aarch64 --ci
      - name: Verify exact final APK and retain selected bytes
        run: |
          python app/scripts/check-apk.py --installer app/src-tauri/gen/android/app/build/outputs/apk/arm64/debug/app-arm64-debug.apk --abi arm64-v8a --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --expected-notices app/src-tauri/bundled/THIRD-PARTY.txt --retain-installer app/.build/android-final/PractiQ.apk --output server/reports/checks/android-package.json
      - name: Stage gated Android test candidate
        if: inputs.release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python app/scripts/release.py stage --platform android --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --android-runtime-inventory app/.build/android-runtime.json --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: inputs.release
        with:
          name: release-Android
          path: app/.build/release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: android-package-evidence
          path: |
            server/reports/checks/android-package.json
            app/.build/android-runtime.json
            app/src-tauri/bundled/build-manifest.json
            app/src-tauri/bundled/THIRD-PARTY.txt
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          name: PractiQ-Android-debug-arm64
          path: app/.build/android-final/PractiQ.apk
          if-no-files-found: error
          retention-days: 14
  emulator:
    name: Android API 35 emulator
    needs: [changes, quality]
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Select the pinned native toolchain
        run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: rustup target add x86_64-linux-android
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          key: android-x86_64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: npm ci
        working-directory: app
      - name: Resolve native Android projects without distributable resources
        working-directory: app
        run: npm run tauri -- android build --debug --apk --split-per-abi --target x86_64 --ci --config '{"bundle":{"resources":[]}}'
      - name: Prepare the exact emulator runtime notices
        run: |
          app/src-tauri/gen/android/gradlew -p app/src-tauri/gen/android :app:exportRuntimeNoticeInventory -PpractiqNoticeConfiguration=x86_64DebugRuntimeClasspath -PpractiqNoticeOutput="$PWD/app/.build/android-runtime.json" --no-daemon
          python app/scripts/prepare-package.py --platform android --architecture x86_64 --android-runtime-inventory app/.build/android-runtime.json
      - name: Build and check the emulator APK
        run: |
          cd app
          npm run tauri -- android build --debug --apk --split-per-abi --target x86_64 --ci
          cd ..
          python app/scripts/check-apk.py --installer app/src-tauri/gen/android/app/build/outputs/apk/x86_64/debug/app-x86_64-debug.apk --abi x86_64 --aapt2 "$ANDROID_HOME/build-tools/36.0.0/aapt2" --expected-notices app/src-tauri/bundled/THIRD-PARTY.txt --output server/reports/checks/android-package.json
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: app/src-tauri/gen/android/gradlew -p app/src-tauri/gen/android :app:testX86_64DebugUnitTest :app:connectedX86_64DebugAndroidTest -x rustBuildX86_64Debug -PabiList=x86_64 -ParchList=x86_64 -PtargetList=x86_64 --no-daemon
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ always() }}
        with:
          name: android-emulator-tests
          path: |
            app/src-tauri/gen/android/app/build/reports/tests/
            app/src-tauri/gen/android/app/build/reports/androidTests/
            app/src-tauri/gen/android/app/build/outputs/androidTest-results/
            server/reports/checks/android-package.json
          retention-days: 7
  gate:
    name: Android CI
    needs: [changes, quality, package, emulator]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python server/scripts/ci_scope.py gate android

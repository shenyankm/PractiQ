name: AI service
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: service-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL_CHECKS: ${{ inputs.ref != '' }}
        run: python server/scripts/ci_scope.py scope service
  quality:
    name: Service quality
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TEST_DATABASE_URI: postgresql://postgres:practiq-test@127.0.0.1:5432/postgres
      TEST_RABBITMQ_URI: amqp://practiq-test:practiq-test@127.0.0.1:5672/
      TEST_RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: practiq-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
        env:
          RABBITMQ_DEFAULT_USER: practiq-test
          RABBITMQ_DEFAULT_PASS: practiq-test
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install independent web dependencies
        run: make web-install
      - name: Audit independent web dependencies
        run: npm --prefix web audit --audit-level=high
      - name: Install browser for service web checks
        run: npx --prefix web playwright install --with-deps chromium
      - name: Verify independent service web frontend
        env:
          VITEST_MAX_WORKERS: '2'
        run: make web-check
      - name: Upload service web check reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-web-checks
          path: |
            web/test-results/
            coverage/web/
          if-no-files-found: error
          retention-days: 7
      - name: Install PDF fallback fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install locked dependencies
        run: make install-locked AI_PYTHON="$(command -v python)"
      - name: Verify service
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          TEST_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: make verify AI_PYTHON="$(command -v python)"
      - name: Verify operational alert rules
        run: make alerts-check
      - name: Upload check reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-checks
          path: |
            server/reports/checks/probes.xml
            server/reports/checks/probes.json
            server/reports/checks/probes.md
            server/reports/checks/coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Audit locked dependencies
        run: make audit AI_PYTHON="$(command -v python)"
      - name: Build service image
        run: make image-check
  gate:
    name: Service CI
    needs: [changes, quality]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python server/scripts/ci_scope.py gate service

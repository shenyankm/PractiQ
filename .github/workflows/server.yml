name: AI service
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install PDF fallback fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install locked dependencies
        run: make install-locked AI_PYTHON="$(command -v python)"
      - name: Verify service
        run: make verify AI_PYTHON="$(command -v python)"
      - name: Upload check reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: service-checks
          path: |
            server/reports/checks/probes.xml
            server/reports/checks/probes.json
            server/reports/checks/probes.md
            server/reports/checks/coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Audit locked dependencies
        run: make audit AI_PYTHON="$(command -v python)"
      - name: Build service image
        run: make image-check

name: AI service
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: service-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL_CHECKS: ${{ inputs.ref != '' }}
        run: python server/scripts/ci_scope.py scope service
  quality:
    name: Service quality (Python ${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    env:
      TEST_DATABASE_URI: postgresql://postgres:practiq-test@127.0.0.1:5432/postgres
      TEST_RABBITMQ_URI: amqp://practiq-test:practiq-test@127.0.0.1:5672/
      TEST_RABBITMQ_MANAGEMENT_URL: http://127.0.0.1:15672
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: practiq-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      rabbitmq:
        image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
        env:
          RABBITMQ_DEFAULT_USER: practiq-test
          RABBITMQ_DEFAULT_PASS: practiq-test
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: matrix.python == '3.15'
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install independent web dependencies
        if: matrix.python == '3.15'
        run: make web-install
      - name: Audit independent web dependencies
        if: matrix.python == '3.15'
        run: npm --prefix web audit --audit-level=high
      - name: Install browser for service web checks
        if: matrix.python == '3.15'
        run: npx --prefix web playwright install --with-deps chromium
      - name: Verify independent service web frontend
        if: matrix.python == '3.15'
        env:
          VITEST_MAX_WORKERS: '2'
        run: make web-check
      - name: Upload service web check reports
        if: ${{ always() && matrix.python == '3.15' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-web-checks
          path: |
            web/test-results/
            coverage/web/
          if-no-files-found: error
          retention-days: 7
      - name: Install PDF fallback fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - name: Install locked dependencies
        run: make install-locked AI_PYTHON="$(command -v python)"
      - name: Verify service
        env:
          TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          TEST_RABBITMQ_CONTAINER: ${{ job.services.rabbitmq.id }}
        run: make verify AI_PYTHON="$(command -v python)"
      - name: Verify operational alert rules
        if: matrix.python == '3.15'
        run: make alerts-check
      - name: Upload check reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: service-checks${{ matrix.python == '3.14' && '-python314' || '' }}
          path: |
            server/reports/checks/probes.xml
            server/reports/checks/probes.json
            server/reports/checks/probes.md
            server/reports/checks/coverage.xml
          if-no-files-found: warn
          retention-days: 14
      - name: Audit locked dependencies
        run: make audit AI_PYTHON="$(command -v python)"
      - name: Build service image
        if: matrix.python == '3.15'
        run: make image-check
      - name: Smoke-test runtime image
        if: matrix.python == '3.15'
        run: >-
          docker run --rm --entrypoint python practiq-ai:ci -c
          'import os,sys,shutil,pydantic,ormsgpack,orjson,jiter,uuid_utils,zstandard;
          import practiq_ai.webapp,yaml._yaml;
          assert sys.version_info[:2] == (3,15);
          assert os.getuid() == 10001;
          assert all(shutil.which(tool) is None for tool in ("gcc","cargo","rustc"))'
  gate:
    name: Service CI
    needs: [changes, quality]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python server/scripts/ci_scope.py gate service

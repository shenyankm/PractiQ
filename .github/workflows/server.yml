name: Embedded AI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: service-${{ inputs.ref || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
      sha: ${{ inputs.ref || github.sha }}
    steps:
      - name: Validate immutable source revision
        id: validate-source
        env:
          SOURCE_SHA: ${{ inputs.ref || github.sha }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Source revision must be a full commit SHA.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          CI_FULL_CHECKS: ${{ inputs.ref != '' }}
        run: node .github/scripts/ci-scope.ts scope service
  quality:
    name: Embedded AI quality
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Verify shared contracts and maintainer types
        working-directory: app
        run: |
          npm run contracts:check
          npm run check:packaging
      - name: Verify Node CI guards
        run: node --test .github/scripts/*.test.ts
      - name: Verify embedded AI, SQLite and recovery with required coverage
        working-directory: app
        run: npm run test:desktop
      - name: Audit locked Node dependencies
        working-directory: app
        run: npm audit --audit-level=high
      - name: Retain test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: embedded-ai-checks
          path: |
            app/.build/reports/desktop.xml
            coverage/desktop/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
  gate:
    name: Service CI
    needs: [changes, quality]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require validated source
        env:
          SOURCE_STATUS: ${{ needs.changes.result }}
        run: test "$SOURCE_STATUS" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: node .github/scripts/ci-scope.ts gate service

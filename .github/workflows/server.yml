name: AI service
on:
  pull_request:
    paths: ["server/**", "Dockerfile.server", "compose.yaml", ".github/workflows/server.yml"]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests product_tests scripts
      - run: uv run pyright
      - run: uv run python scripts/evaluate.py --validate-only
      - run: uv run pip-audit
      - run: uv run coverage run -m pytest
      - run: uv run coverage report -m
      - run: uv run langgraph validate
      - run: uv build
      - run: docker compose -f ../compose.yaml config --quiet
      - run: docker build -f Dockerfile.server -t practiq-ai:ci .
        working-directory: .

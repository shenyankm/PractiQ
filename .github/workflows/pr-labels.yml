name: PR labels
on:
  pull_request_target:
    branches: [main]
    types: [opened]
  pull_request:
    paths:
      - .github/labels.json
      - .github/scripts/issue-labeler*.mjs
      - .github/scripts/pr-labeler*.mjs
      - .github/workflows/pr-labels.yml
  workflow_dispatch:
    inputs:
      number:
        description: Open PR number to classify (targeting main)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr-labels-${{ github.event.pull_request.number || inputs.number || github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/issue-labeler.test.mjs .github/scripts/pr-labeler.test.mjs
  label:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: PractiQ Issue
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Never check out, build or execute the PR head in this privileged job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: node --test .github/scripts/issue-labeler.test.mjs .github/scripts/pr-labeler.test.mjs
      - name: Classify the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PRACTIQ_AGENT_API_KEY: ${{ secrets.API_KEY }}
          PRACTIQ_AGENT_BASE_URL: ${{ secrets.BASE_URL }}
          PRACTIQ_AGENT_MODEL: ${{ secrets.MODEL }}
        run: node .github/scripts/pr-labeler.mjs

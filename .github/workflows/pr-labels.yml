name: PR labels
on:
  pull_request_target:
    branches: [main]
    types: [opened]
  pull_request:
    paths:
      - .github/labels.json
      - .github/scripts/issue-labeler*.mjs
      - .github/scripts/pr-labeler*.mjs
      - .github/workflows/pr-labels.yml
  workflow_dispatch:
    inputs:
      number:
        description: Open PR number to classify (targeting main)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: pr-labels-${{ github.event.pull_request.number || inputs.number || github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/issue-labeler.test.mjs .github/scripts/pr-labeler.test.mjs
  label:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: practiq-agent
    permissions:
      contents: read
    steps:
      # Never check out, build or execute the PR head in this privileged job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: node --test .github/scripts/issue-labeler.test.mjs .github/scripts/pr-labeler.test.mjs
      - name: Create PR labeling token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRACTIQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRACTIQ_APP_PRIVATE_KEY }}
          repositories: ${{ github.repository }}
          permission-pull-requests: write
      - name: Classify the pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PRACTIQ_AGENT_API_KEY: ${{ secrets.PRACTIQ_AGENT_API_KEY }}
          PRACTIQ_AGENT_BASE_URL: ${{ vars.PRACTIQ_AGENT_BASE_URL }}
          PRACTIQ_AGENT_MODEL: ${{ vars.PRACTIQ_AGENT_MODEL }}
        run: node .github/scripts/pr-labeler.mjs

name: Release draft
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable candidate tag, e.g. v0.1.0-alpha.1
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.candidate.outputs.sha }}
      prerelease: ${{ steps.candidate.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - id: candidate
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          python app/scripts/release.py check --tag "$RELEASE_TAG"
      - name: Reject an existing release before rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/releases.json"
          python -c 'import json, os; from pathlib import Path; assert not any(r["tag_name"] == os.environ["RELEASE_TAG"] for page in json.loads(Path(os.environ["RUNNER_TEMP"], "releases.json").read_text()) for r in page), "Release already exists; do not replace its assets"'
  service:
    needs: candidate
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/server.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}
  apps:
    needs: candidate
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/app.yml
    with:
      ref: ${{ needs.candidate.outputs.sha }}
      tag: ${{ inputs.tag }}
      release: true
  draft:
    needs: [candidate, service, apps]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.candidate.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-macOS
          path: app/.build/release-inputs/release-macOS/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: service-checks
          path: app/.build/release-inputs/service-checks/
      - name: Generate a change summary for maintainer review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" -f target_commitish="$CANDIDATE_SHA" \
            -f configuration_file_path=.github/release.yml --jq .body > "$RUNNER_TEMP/release-changes.md"
      - name: Assemble versioned assets, checksums and draft notes
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python app/scripts/release.py assemble --tag "$RELEASE_TAG" --inputs app/.build/release-inputs --output app/.build/release-assets --changes "$RUNNER_TEMP/release-changes.md"
      - name: Attest the checked draft assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            app/.build/release-assets/PractiQ_*
            app/.build/release-assets/SHA256SUMS.txt
            app/.build/release-assets/release-manifest.json
            app/.build/release-assets/release-evidence.zip
      - name: Verify provenance before creating the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          for asset in app/.build/release-assets/PractiQ_* app/.build/release-assets/SHA256SUMS.txt app/.build/release-assets/release-manifest.json app/.build/release-assets/release-evidence.zip; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --bundle "$ATTESTATION_BUNDLE" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$RELEASE_TAG" --source-digest "$CANDIDATE_SHA" --deny-self-hosted-runners
          done
      - name: Create draft without publishing or replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PRERELEASE: ${{ needs.candidate.outputs.prerelease }}
          CANDIDATE_SHA: ${{ needs.candidate.outputs.sha }}
        run: |
          remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha)
          test "$remote_sha" = "$CANDIDATE_SHA"
          flags=(--draft --verify-tag --latest=false --title "PractiQ $RELEASE_TAG" --notes-file app/.build/release-assets/RELEASE_NOTES.md)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          gh release create "$RELEASE_TAG" "${flags[@]}" app/.build/release-assets/PractiQ_* app/.build/release-assets/SHA256SUMS.txt app/.build/release-assets/release-manifest.json app/.build/release-assets/release-evidence.zip

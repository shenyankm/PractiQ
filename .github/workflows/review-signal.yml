name: PR review signal
# Review events use a PR ref; privileged revalidation must run on main.
on:
  pull_request_review:
    types: [submitted, edited, dismissed]
permissions: {}
jobs:
  signal:
    if: >-
      github.event.review.user.login == 'chatgpt-codex-connector[bot]' &&
      github.event.review.commit_id == github.event.pull_request.head.sha &&
      github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - run: echo 'Connector review changed; trusted main will revalidate approval.'

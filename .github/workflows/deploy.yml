name: Production deployment
on:
  push:
    branches: [main, sheny/production-cicd]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  verify:
    uses: ./.github/workflows/server.yml
    with:
      ref: ${{ github.sha }}
  image:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make web-install web-build
      - name: Build immutable service image
        run: |
          docker build -f Dockerfile.server -t "practiq-ai:$GITHUB_SHA" .
          docker save "practiq-ai:$GITHUB_SHA" | gzip > service-image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-image
          path: service-image.tar.gz
          retention-days: 3
          compression-level: 0
  deploy:
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://practiq.shenyankm.com
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: production-image
      - name: Deploy verified image over restricted SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          gzip -dc service-image.tar.gz | ssh -o BatchMode=yes -o StrictHostKeyChecking=yes ubuntu@122.51.255.108 "deploy $GITHUB_SHA"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 15 https://practiq.shenyankm.com/ready
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f ~/.ssh/id_ed25519

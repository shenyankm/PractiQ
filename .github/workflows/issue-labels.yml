name: Issue labels
on:
  issues:
    types: [opened, edited, reopened]
  push:
    branches: [main]
    paths:
      - .github/labels.json
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/issue-labeler*.mjs
      - .github/workflows/issue-labels.yml
  pull_request:
    paths:
      - .github/labels.json
      - .github/ISSUE_TEMPLATE/**
      - .github/scripts/issue-labeler*.mjs
      - .github/workflows/issue-labels.yml
  workflow_dispatch:
    inputs:
      number:
        description: Issue number to classify; leave empty to synchronize core label definitions
        type: string
permissions:
  contents: read
concurrency:
  group: issue-labels-${{ github.event.issue.number || inputs.number || github.ref }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/issue-labeler.test.mjs
  label:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    environment: practiq-agent
    permissions:
      contents: read
      issues: write
    steps:
      # Only default-branch code receives the write token; issue text stays in JSON.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: node --test .github/scripts/issue-labeler.test.mjs
      - name: Synchronize labels or classify an issue
        env:
          GH_TOKEN: ${{ github.token }}
          PRACTIQ_AGENT_API_KEY: ${{ secrets.PRACTIQ_AGENT_API_KEY }}
          PRACTIQ_AGENT_BASE_URL: ${{ vars.PRACTIQ_AGENT_BASE_URL }}
          PRACTIQ_AGENT_MODEL: ${{ vars.PRACTIQ_AGENT_MODEL }}
        run: node .github/scripts/issue-labeler.mjs

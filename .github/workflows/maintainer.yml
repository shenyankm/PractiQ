name: PractiQ PR bot
on:
  pull_request_target:
    types: [closed, converted_to_draft, reopened, ready_for_review, edited]
  pull_request:
    paths:
      - .github/scripts/maintainer*.mjs
      - .github/main-ruleset.json
      - .github/workflows/maintainer.yml
      - .github/workflows/review-signal.yml
  workflow_run:
    workflows: [AI service, Practice App, PR review signal]
    types: [completed]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
    inputs:
      number:
        description: PR number; leave empty to check all open PRs targeting main
        type: string
      dry_run:
        description: Check eligibility without approving or dismissing reviews
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: practiq-agent-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'review' }}
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: node --test .github/scripts/maintainer.test.mjs
  approve:
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.name != 'PR review signal' ||
       (github.event.workflow_run.event == 'pull_request_review' &&
        github.event.workflow_run.conclusion == 'success')) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
        contains(github.event.comment.body, 'codex-pull-request-review-summary')))
    runs-on: ubuntu-22.04
    environment: practiq-agent
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      checks: read
      statuses: read
    steps:
      # Always run trusted default-branch code, never a PR or workflow_run head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - run: node --test .github/scripts/maintainer.test.mjs
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.PRACTIQ_APP_CLIENT_ID }}
          private-key: ${{ secrets.PRACTIQ_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Approve only after clean Codex evidence and passing CI
        env:
          GH_READ_TOKEN: ${{ github.token }}
          GH_REVIEW_TOKEN: ${{ steps.app.outputs.token }}
          PR_NUMBER: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event_name == 'issue_comment' && github.event.issue.number || github.event_name == 'workflow_run' && github.event.workflow_run.name == 'PR review signal' && github.event.workflow_run.pull_requests[0].number || inputs.number }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node .github/scripts/maintainer.mjs

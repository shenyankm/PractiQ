name: Desktop
on:
  push:
    paths: ['app/**', 'server/**', 'Makefile', '.github/workflows/desktop.yml']
  pull_request:
    paths: ['app/**', 'server/**', 'Makefile', '.github/workflows/desktop.yml']
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      # Source checks do not build the macOS-only Python bundle.
      TAURI_CONFIG: '{"bundle":{"resources":[]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.13'
      - name: Install locked Python runtime
        working-directory: server
        run: |
          uv export --locked --no-dev --no-emit-project -o "$env:RUNNER_TEMP/requirements.txt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv pip install --python "$env:pythonLocation/python.exe" -r "$env:RUNNER_TEMP/requirements.txt"
      - run: python app/scripts/export-contracts.py --check
      - run: python app/scripts/check-fixtures.py
      - run: npm ci
        working-directory: app
      - run: npm run build
        working-directory: app
      - run: npx vitest run
        working-directory: app
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Verify Rust import contracts
        run: cargo test --manifest-path app/src-tauri/Cargo.toml shared_contract_corpus
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.13'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: make install-locked app-install-python AI_PYTHON=python
      - run: make app-install
      - run: make app-check AI_PYTHON=python
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - run: make app-build AI_PYTHON=python
      - run: python app/scripts/check-bundle.py --bundle app/src-tauri/target/release/bundle/macos/PractiQ.app/Contents/Resources/bundled
      - run: ditto -c -k --keepParent app/src-tauri/target/release/bundle/macos/PractiQ.app app/PractiQ-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PractiQ-macOS
          path: |
            app/PractiQ-macOS.zip
            app/src-tauri/target/release/bundle/dmg/*.dmg
            server/reports/checks/desktop-bundle.json
            app/src-tauri/bundled/build-manifest.json

name: Desktop
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
        run: python server/scripts/ci_scope.py scope desktop
  quality:
    name: Desktop quality
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
          key: quality
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install locked service dependencies for contract checks
        run: make install-locked AI_PYTHON=python
      - run: python app/scripts/export-contracts.py --check
      - run: python app/scripts/check-fixtures.py
      - run: python -m pytest server/tests/test_ci.py server/tests/test_ci_scope.py server/tests/test_release_checks.py
      - run: npm ci
        working-directory: app
      - name: Check frontend types, lint and coverage
        working-directory: app
        run: npm run check:ui
      - run: npx playwright install --with-deps chromium --only-shell
        working-directory: app
      - run: npm run test:browser
        working-directory: app
      - name: Upload browser diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-browser
          path: app/test-results/browser/
          retention-days: 7
      - run: npm audit --audit-level=high
        working-directory: app
      - run: cargo fmt --manifest-path app/src-tauri/Cargo.toml --check
      - name: Install pinned Rust advisory checker
        run: cargo install cargo-audit --locked --version 0.22.2 --registry crates-io
      - run: make audit-rust
      - name: Test GLib safety backport with release optimizations
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-dev
          cargo test --locked --release --manifest-path app/src-tauri/vendor/glib/Cargo.toml --target-dir app/src-tauri/target/glib-backport --lib variant_iter::tests
      - name: Upload frontend coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-coverage
          path: coverage/app/
          retention-days: 7
  package:
    name: Desktop package (${{ matrix.platform }})
    needs: [changes, quality]
    if: needs.changes.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
          - os: ubuntu-22.04
            platform: Linux
          - os: macos-15
            platform: macOS
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Install Linux build and media dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev gstreamer1.0-plugins-good gstreamer1.0-plugins-bad gstreamer1.0-libav gnome-keyring libxinerama1 libcairo2 libcups2 libfontconfig1 libsm6 libice6 libxext6 libxrender1 fonts-noto-cjk
      - name: Install CJK test font on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $font = Join-Path $env:WINDIR 'Fonts/NotoSansCJKsc-Regular.otf'
          Invoke-WebRequest 'https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf' -OutFile $font
          if ((Get-FileHash $font -Algorithm SHA256).Hash -ne '2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b') { throw 'Unexpected CJK font checksum' }
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Fonts' -Name 'Noto Sans CJK SC (OpenType)' -Value 'NotoSansCJKsc-Regular.otf' -PropertyType String -Force
          Add-Type 'using System.Runtime.InteropServices; public static class CiFonts { [DllImport("gdi32.dll", CharSet=CharSet.Unicode, ExactSpelling=true)] public static extern int AddFontResourceW(string path); }'
          if ([CiFonts]::AddFontResourceW($font) -eq 0) { throw 'CJK font registration failed' }
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: app/src-tauri
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.13'
          enable-cache: true
          cache-dependency-glob: server/uv.lock
      - name: Install locked Python runtime and bundler
        working-directory: server
        run: |
          desktop_python="$(python -c 'import sys; print(sys.executable)')"
          uv export --locked --extra dev --extra desktop --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$desktop_python" -r "$RUNNER_TEMP/requirements.txt"
          uv pip install --python "$desktop_python" --no-deps -e .
      - run: python -m pytest server/tests/test_desktop_platforms.py server/tests/test_office.py server/tests/test_office_bundle.py
      - run: npm ci
        working-directory: app
      - name: Verify Rust flows and lint
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: |
          cargo test --locked --manifest-path app/src-tauri/Cargo.toml
          cargo clippy --locked --manifest-path app/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Verify Windows credential storage
        if: runner.os == 'Windows'
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: cargo test --locked --manifest-path app/src-tauri/Cargo.toml native_keychain_roundtrip -- --ignored
      - name: Verify Linux credential storage
        if: runner.os == 'Linux'
        env:
          TAURI_CONFIG: '{"bundle":{"resources":[]}}'
        run: |
          dbus-run-session -- bash -c 'printf "ci-test-password" | gnome-keyring-daemon --unlock --components=secrets; cargo test --locked --manifest-path app/src-tauri/Cargo.toml native_keychain_roundtrip -- --ignored'
      - run: python app/scripts/bundle-python.py
      - run: npm run tauri -- build
        working-directory: app
      - name: Verify installed Windows service
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem app/src-tauri/target/release/bundle/nsis/*-setup.exe)[0]
          $destination = Join-Path $env:RUNNER_TEMP 'PractiQ'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          python app/scripts/check-bundle.py --bundle "$destination/bundled"
          if ($LASTEXITCODE -ne 0) { throw "Packaged service checks failed" }
          python app/scripts/check-office.py --isolated --bundle "$destination/bundled"
      - name: Verify packaged Linux service
        if: runner.os == 'Linux'
        run: |
          dependencies="$(dpkg-deb -f app/src-tauri/target/release/bundle/deb/*.deb Depends)"
          for dependency in libwebkit2gtk-4.1-0 libgtk-3-0; do
            printf '%s\n' "$dependencies" | tr ',' '\n' | sed 's/^ *//' | grep -Fx "$dependency"
          done
          dpkg-deb -x app/src-tauri/target/release/bundle/deb/*.deb "$RUNNER_TEMP/practiq-package"
          python app/scripts/check-bundle.py --bundle "$RUNNER_TEMP/practiq-package/usr/lib/PractiQ/bundled"
          python app/scripts/check-office.py --isolated --bundle "$RUNNER_TEMP/practiq-package/usr/lib/PractiQ/bundled"
      - name: Verify packaged macOS service
        if: runner.os == 'macOS'
        run: |
          python app/scripts/check-bundle.py --bundle app/src-tauri/target/release/bundle/macos/PractiQ.app/Contents/Resources/bundled
          python app/scripts/check-office.py --isolated --bundle app/src-tauri/target/release/bundle/macos/PractiQ.app/Contents/Resources/bundled
      - name: Archive macOS application
        if: runner.os == 'macOS' && github.event_name != 'pull_request'
        run: ditto -c -k --keepParent app/src-tauri/target/release/bundle/macos/PractiQ.app app/PractiQ-macOS.zip
      - name: Upload package verification reports
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: desktop-checks-${{ matrix.platform }}
          path: |
            server/reports/checks/desktop-bundle.json
            server/reports/checks/office*
            app/src-tauri/bundled/build-manifest.json
          retention-days: 7
      - name: Upload installers
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: PractiQ-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/nsis/*-setup.exe
            app/src-tauri/target/release/bundle/deb/*.deb
            app/src-tauri/target/release/bundle/dmg/*.dmg
            app/PractiQ-macOS.zip
          if-no-files-found: error
          retention-days: 14
  gate:
    name: Desktop CI
    needs: [changes, quality, package]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: python server/scripts/ci_scope.py gate desktop

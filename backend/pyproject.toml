[project]
name = "practiq-backend"
version = "1.0.0"
description = "PractiQ single-user product API"
requires-python = ">=3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3", "psycopg[binary,pool]>=3.2,<4", "httpx>=0.28,<1", "python-multipart>=0.0.20", "pillow>=11", "python-dotenv>=1"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/practiq_backend"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

spring:
  application:
    name: practiq-backend
  datasource:
    url: "${POSTGRES_URL:jdbc:postgresql://localhost:54322/practiq_app}"
    username: "${POSTGRES_USER:practiq}"
    password: "${POSTGRES_PASSWORD:practiq}"
  data:
    redis:
      url: "${REDIS_URL:redis://localhost:6379}"
  jackson:
    # Keep existing wire/storage defaults while using Jackson 3.
    use-jackson2-defaults: true
    property-naming-strategy: LOWER_CAMEL_CASE
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
server:
  port: "${PORT:8080}"
practiq:
  auth-secret: "${AUTH_SECRET:?AUTH_SECRET is required}"
  app-origin: "${APP_ORIGIN:http://127.0.0.1:3000}"
  redis-key-prefix: "${REDIS_KEY_PREFIX:practiq}"
  secure-cookies: "${SECURE_COOKIES:true}"
  object-storage-mount-dir: "${OBJECT_STORAGE_MOUNT_DIR:/tmp/practiq-media}"
  wechat:
    app-id: "${WECHAT_APP_ID:}"
    app-secret: "${WECHAT_APP_SECRET:}"
    pay:
      mch-id: "${WECHAT_MCH_ID:}"
      merchant-serial-number: "${WECHAT_MERCHANT_SERIAL_NUMBER:}"
      merchant-private-key-path: "${WECHAT_MERCHANT_PRIVATE_KEY_PATH:}"
      api-v3-key: "${WECHAT_API_V3_KEY:}"
      notify-url: "${WECHAT_PAYMENT_NOTIFY_URL:}"
      refund-notify-url: "${WECHAT_REFUND_NOTIFY_URL:}"
  ai:
    base-url: "${AI_SERVICE_URL:http://127.0.0.1:8090}"
    service-token: "${AI_SERVICE_TOKEN:}"
    enabled: "${AI_ENABLED:true}"
    input-price-per-1k: "${AI_INPUT_PRICE_PER_1K:0.010000}"
    output-price-per-1k: "${AI_OUTPUT_PRICE_PER_1K:0.030000}"
    answer-estimated-credits: "${AI_ANSWER_ESTIMATED_CREDITS:1.00}"
    report-estimated-credits: "${AI_REPORT_ESTIMATED_CREDITS:2.00}"

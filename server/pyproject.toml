[project]
name = "practiq-ai-service"
version = "0.1.0"
description = "PractiQ internal AI document-processing service"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn==0.51.0",
  "pydantic==2.13.4",
  "pypdfium2==5.12.1",
  "pillow==12.3.0",
  "openpyxl==3.1.5",
  "langgraph==1.2.11",
  "langchain-openai==1.5.1",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

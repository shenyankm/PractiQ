[project]
name = "practiq-server"
version = "0.1.0"
description = "PractiQ unified backend service (API + AI)"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn==0.51.0",
  "pydantic==2.13.4",
  "agentscope==2.0.5",
  "psycopg[binary,pool]==3.2.13",
  "redis==7.1.0",
  "bcrypt==5.0.0",
  "httpx==0.28.1",
  "python-multipart==0.0.21",
  "pypdfium2==5.12.1",
  "pillow==12.3.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.3.0", "fakeredis[lua]==2.32.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[project]
name = "practiq-ai-service"
version = "0.3.0"
description = "PractiQ internal AI document-processing service"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.139.0",
  "pydantic==2.13.4",
  "pypdfium2==5.12.1",
  "pillow==12.3.0",
  "openpyxl==3.1.5",
  "python-docx==1.2.0",
  "docx2python==3.7.1",
  "langgraph==1.2.11",
  "langgraph-sdk==0.4.2",
  "langchain-core==1.5.6",
  "langchain-openai==1.5.1",
  "openai==3.2.0",
  "oss2==2.19.1",
]

[project.optional-dependencies]
dev = [
  "coverage==7.16.0",
  "httpx==0.28.1",
  "pip-audit==2.10.1",
  "pyright==1.1.411",
  "pytest==9.1.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.16.3",
  "langgraph-cli[inmem]==0.4.31",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/practiq_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "product_tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
branch = true
source = ["practiq_ai"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

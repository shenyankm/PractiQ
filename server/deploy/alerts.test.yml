rule_files: [alerts.rules.yml]
evaluation_interval: 1m
tests:
  - interval: 1m
    input_series:
      - series: 'practiq_failures_total{code="MODEL_RESULT_UNKNOWN"}'
        values: '0 1+0x10'
      - series: 'practiq_failures_total{code="RUN_DEADLINE_EXCEEDED"}'
        values: '0 1+0x10'
    alert_rule_test:
      - eval_time: 2m
        alertname: PractiQUnknownUsage
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "Provider usage is unknown; inspect durable call records"}
      - eval_time: 2m
        alertname: PractiQBudgetOrDeadline
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "Document execution reached a bounded stop"}
      - eval_time: 10m
        alertname: PractiQUnknownUsage
        exp_alerts: []
      - eval_time: 10m
        alertname: PractiQBudgetOrDeadline
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: 'practiq_model_calls_total{kind="document_parse",outcome="unknown"}'
        values: '0 1 1 1'
      - series: 'practiq_failures_total{code="DOCUMENT_CHECKSUM_MISMATCH"}'
        values: '0 1 1 1'
    alert_rule_test:
      - eval_time: 2m
        alertname: PractiQUnknownUsage
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "Provider usage is unknown; inspect durable call records"}
      - eval_time: 2m
        alertname: PractiQChecksumMismatch
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations: {summary: "Document integrity verification failed"}
  - interval: 1m
    input_series:
      - series: 'practiq_pending_runs{instance="full"}'
        values: '292+0x10'
      - series: 'practiq_running_runs{instance="full"}'
        values: '8+0x10'
      - series: 'practiq_queue_capacity{instance="full"}'
        values: '300+0x10'
      - series: 'practiq_pending_runs{instance="custom"}'
        values: '2+0x10'
      - series: 'practiq_running_runs{instance="custom"}'
        values: '8+0x10'
      - series: 'practiq_queue_capacity{instance="custom"}'
        values: '10+0x10'
      - series: 'practiq_pending_runs{instance="available"}'
        values: '291+0x10'
      - series: 'practiq_running_runs{instance="available"}'
        values: '8+0x10'
      - series: 'practiq_queue_capacity{instance="available"}'
        values: '300+0x10'
    alert_rule_test:
      - eval_time: 6m
        alertname: PractiQQueueBacklog
        exp_alerts:
          - exp_labels: {severity: warning, instance: full}
            exp_annotations: {summary: "Document queue remains at admission capacity"}
          - exp_labels: {severity: warning, instance: custom}
            exp_annotations: {summary: "Document queue remains at admission capacity"}
  - interval: 1m
    input_series: []
    alert_rule_test:
    - eval_time: 2m
      alertname: PractiQServiceUnavailable
      exp_alerts:
      - exp_labels:
          severity: critical
          job: practiq-ai
        exp_annotations:
          summary: AI service metrics are unavailable
    - eval_time: 2m
      alertname: PractiQNotReady
      exp_alerts:
      - exp_labels:
          severity: critical
          job: practiq-ready
        exp_annotations:
          summary: External readiness probe is failing or missing
    - eval_time: 2m
      alertname: PractiQContainerMonitoringUnavailable
      exp_alerts:
      - exp_labels:
          severity: warning
          job: practiq-containers
        exp_annotations:
          summary: Container resource monitoring is unavailable
  - interval: 1m
    input_series:
    - series: up{job="practiq-ai",instance="ai"}
      values: 0x3 1x4
    - series: probe_success{job="practiq-ready",instance="ready"}
      values: 0x3 1x4
    alert_rule_test:
    - eval_time: 2m
      alertname: PractiQServiceUnavailable
      exp_alerts:
      - exp_labels:
          severity: critical
          job: practiq-ai
          instance: ai
        exp_annotations:
          summary: AI service metrics are unavailable
    - eval_time: 2m
      alertname: PractiQNotReady
      exp_alerts:
      - exp_labels:
          severity: critical
          job: practiq-ready
          instance: ready
        exp_annotations:
          summary: External readiness probe is failing or missing
    - eval_time: 5m
      alertname: PractiQServiceUnavailable
      exp_alerts: []
    - eval_time: 5m
      alertname: PractiQNotReady
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: practiq_storage_healthy{instance="ai"}
      values: 0x7 1x3
    - series: practiq_storage_free_bytes{instance="ai"}
      values: 5x7 50x3
    - series: practiq_storage_total_bytes{instance="ai"}
      values: 100x11
    - series: practiq_storage_free_inodes{instance="inode-only"}
      values: 4x7 50x3
    - series: practiq_storage_total_inodes{instance="inode-only"}
      values: 100x11
    - series: practiq_storage_free_bytes{instance="healthy"}
      values: 50x11
    - series: practiq_storage_total_bytes{instance="healthy"}
      values: 100x11
    alert_rule_test:
    - eval_time: 2m
      alertname: PractiQStorageUnavailable
      exp_alerts:
      - exp_labels:
          severity: critical
          instance: ai
        exp_annotations:
          summary: File storage probe failed; new imports are blocked
    - eval_time: 6m
      alertname: PractiQStorageCapacity
      exp_alerts:
      - exp_labels:
          severity: warning
          instance: ai
        exp_annotations:
          summary: Artifact storage has less than 10% free bytes or inodes
      - exp_labels:
          severity: warning
          instance: inode-only
        exp_annotations:
          summary: Artifact storage has less than 10% free bytes or inodes
    - eval_time: 9m
      alertname: PractiQStorageUnavailable
      exp_alerts: []
    - eval_time: 9m
      alertname: PractiQStorageCapacity
      exp_alerts: []
  - interval: 1m
    input_series:
    - series: container_oom_events_total{container_label_com_docker_compose_service="ai",instance="host"}
      values: 0 1x5
    - series: container_start_time_seconds{container_label_com_docker_compose_service="ai",instance="host"}
      values: 100 200 300 400x3
    alert_rule_test:
    - eval_time: 2m
      alertname: PractiQContainerOOM
      exp_alerts:
      - exp_labels:
          severity: critical
          container_label_com_docker_compose_service: ai
          instance: host
        exp_annotations:
          summary: AI container experienced an OOM event
    - eval_time: 3m
      alertname: PractiQContainerRestarts
      exp_alerts:
      - exp_labels:
          severity: warning
          container_label_com_docker_compose_service: ai
          instance: host
        exp_annotations:
          summary: AI container restarted repeatedly
  - interval: 1m
    input_series: []
    alert_rule_test:
    - eval_time: 2m
      alertname: PractiQBackupStale
      exp_alerts:
      - exp_labels: {severity: critical, job: practiq-backups}
        exp_annotations: {summary: "No verified matching backup snapshot within 15 minutes"}
    - eval_time: 2m
      alertname: PractiQBackupMonitoringUnavailable
      exp_alerts:
      - exp_labels: {severity: warning, job: practiq-backups}
        exp_annotations: {summary: "Independent backup monitoring is unavailable"}
  - interval: 1m
    input_series:
    - series: 'practiq_backup_last_attempt_success{job="practiq-backups",instance="backup"}'
      values: '0x20 1x5'
    - series: 'practiq_backup_last_success_timestamp_seconds{job="practiq-backups",instance="backup"}'
      values: '0x20 1260x5'
    - series: 'up{job="practiq-backups",instance="backup"}'
      values: '1x26'
    alert_rule_test:
    - eval_time: 18m
      alertname: PractiQBackupStale
      exp_alerts:
      - exp_labels: {severity: critical, job: practiq-backups, instance: backup}
        exp_annotations: {summary: "No verified matching backup snapshot within 15 minutes"}
    - eval_time: 2m
      alertname: PractiQBackupFailed
      exp_alerts:
      - exp_labels: {severity: critical, job: practiq-backups, instance: backup}
        exp_annotations: {summary: "Matching off-host backup failed or is incomplete"}
    - eval_time: 23m
      alertname: PractiQBackupStale
      exp_alerts: []
    - eval_time: 23m
      alertname: PractiQBackupFailed
      exp_alerts: []

  - interval: 1m
    input_series:
      - series: 'practiq_tencent_unknown_jobs'
        values: '1+0x6 0+0x3'
    alert_rule_test:
      - eval_time: 4m
        alertname: PractiQTencentUnknownSubmission
        exp_alerts: []
      - eval_time: 6m
        alertname: PractiQTencentUnknownSubmission
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "Tencent submission outcome is unknown; inspect saved jobs before resubmitting"}
      - eval_time: 8m
        alertname: PractiQTencentUnknownSubmission
        exp_alerts: []
  - interval: 1m
    input_series:
      - series: practiq_cost_daily_limit_micros
        values: '100x7'
      - series: practiq_cost_daily_reserved_micros
        values: '0 95x2 20x4'
      - series: practiq_worker_sandbox_required
        values: '1 0x2 1x4'
    alert_rule_test:
      - eval_time: 0m
        alertname: PractiQEstimatedCostBudget
        exp_alerts: []
      - eval_time: 2m
        alertname: PractiQEstimatedCostBudget
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "UTC-day estimated-cost reservations exceed 90% of the configured limit"}
      - eval_time: 2m
        alertname: PractiQWorkerSandboxDisabled
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations: {summary: "Native document workers do not require the OS sandbox"}
      - eval_time: 4m
        alertname: PractiQEstimatedCostBudget
        exp_alerts: []
      - eval_time: 4m
        alertname: PractiQWorkerSandboxDisabled
        exp_alerts: []

# Linux host deployment behind a loopback HTTPS proxy; PostgreSQL stores durable state; RabbitMQ delivers runs; artifacts use the persistent local mount.
services:
  ai:
    build:
      context: ../..
      dockerfile: Dockerfile.server
    image: practiq-ai:local
    restart: unless-stopped
    network_mode: host
    init: true
    user: "10001:10001"
    env_file: ../../.env
    environment:
      N_JOBS_PER_WORKER: "2"
      AI_STORAGE_DIR: /var/lib/practiq
      AI_WORKER_SANDBOX: required
      DATABASE_URI: ${DATABASE_URI:?Set the dedicated PostgreSQL connection URL}
      RABBITMQ_URI: ${RABBITMQ_URI:?Set the restricted RabbitMQ service connection URL}
    volumes:
      - type: bind
        source: ${PRACTIQ_STORAGE_DIR:?Set the absolute existing storage directory}
        target: /var/lib/practiq
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=536870912,mode=1777
      - /home/practiq:rw,nosuid,nodev,size=67108864,uid=10001,gid=10001,mode=700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 2g
    pids_limit: 128
    stop_grace_period: 70s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8000/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd
    hostname: practiq-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_ADMIN_USER:?Set a separate RabbitMQ administrator}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_ADMIN_PASSWORD:?Set the RabbitMQ administrator password}
      RABBITMQ_DEFAULT_VHOST: practiq
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    stop_grace_period: 70s
volumes:
  rabbitmq-data:

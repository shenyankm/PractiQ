# Overlay on service.compose.yml. All backend listeners remain private.
services:
  ai:
    command: [python, -m, uvicorn, 'practiq_ai.webapp:app', --host, '127.0.0.1', --port, '8090', --workers, '1', --timeout-graceful-shutdown, '65']
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.build_opener(urllib.request.ProxyHandler({})).open('http://127.0.0.1:8090/ready', timeout=3).close()"]
  rabbitmq:
    # A verified image ID also supports hosts without registry connectivity.
    image: ${PRACTIQ_RABBITMQ_IMAGE:-rabbitmq:4.3.6-management@sha256:8dd6e3570ddaa2ef82a6c3a8950e79c1f73893adfbdddbc374fc1f1ac8a0f5dd}
    ports: !override
      - '127.0.0.1:5673:5672'
      - '127.0.0.1:15673:15672'
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: practiq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the dedicated database password}
      POSTGRES_DB: practiq
    ports:
      - '127.0.0.1:5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U practiq -d practiq']
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:

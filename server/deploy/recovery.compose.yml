# Isolated recovery database only. Use a unique project name; never existing volumes.
services:
  postgres:
    image: postgres:16-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_DB: practiq_oss_test
      POSTGRES_USER: practiq_test
      POSTGRES_PASSWORD: isolated-test-only
    ports: ["127.0.0.1:15432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U practiq_test -d practiq_oss_test"]
      interval: 2s
      timeout: 2s
      retries: 30
volumes:
  postgres:

# One edge per deployment; backend ports must not be publicly reachable.
# Mount as /etc/nginx/nginx.conf; terminate TLS at the existing trusted edge.
events {}
http {
    # Only the local TLS edge may supply the client address; it must overwrite X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    limit_req_zone $binary_remote_addr zone=requests:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=cards:10m rate=5r/m;
    limit_conn_zone $server_name zone=connections:1m;
    server {
        listen 127.0.0.1:8080;
        client_max_body_size 26m;
        client_body_timeout 30s;
        limit_req zone=requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn connections 32;
        limit_conn_status 429;
        proxy_http_version 1.1;
        proxy_read_timeout 1900s;
        proxy_buffering off;
        proxy_set_header Authorization $http_authorization;
        # Base64 expands supported 20 MiB grading images beyond the upload limit.
        location ~ ^/api/subjective-grades/?$ {
            client_max_body_size 32m;
            proxy_pass http://127.0.0.1:8000;
        }
        location ~ ^/api/cards/redeem/?$ {
            limit_req zone=cards burst=5 nodelay;
            proxy_pass http://127.0.0.1:8000;
        }
        location / {
            proxy_pass http://127.0.0.1:8000;
        }
    }
}

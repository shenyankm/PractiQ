# One edge per deployment; backend ports must not be publicly reachable.
# Mount as /etc/nginx/nginx.conf; terminate TLS at the existing trusted edge.
events {}
http {
    limit_req_zone $binary_remote_addr zone=requests:10m rate=10r/s;
    limit_conn_zone $server_name zone=connections:1m;
    server {
        listen 8080;
        client_max_body_size 26m;
        client_body_timeout 30s;
        limit_req zone=requests burst=20 nodelay;
        limit_req_status 429;
        limit_conn connections 32;
        limit_conn_status 429;
        location / {
            proxy_pass http://agent:8000;
            proxy_http_version 1.1;
            proxy_read_timeout 1900s;
            proxy_buffering off;
            proxy_set_header Authorization $http_authorization;
        }
        # No unbounded batch submissions or scheduled work through this ingress.
        location ~ ^/(?:threads/[^/]+/)?(?:runs/batch|crons)(?:/|$) { return 403; }
    }
}

[project]
name = "openwook-ai"
version = "0.1.0"
description = "OpenWook internal AI service"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.35",
  "pydantic>=2.12",
  "httpx>=0.28",
  "python-dotenv>=1.1",
  "mammoth>=1.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4",
  "pytest-asyncio>=1.2",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openwook_ai"]

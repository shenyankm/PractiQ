[project]
name = "practiq-ai"
version = "0.1.0"
description = "PractiQ internal AI service"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn==0.51.0",
  "pydantic==2.13.4",
  "agentscope==2.0.5",
  "pypdfium2==5.12.1",
  "pillow==12.3.0",
  "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# ponytail: 顶层模块名装进 site-packages 仅限专用容器；将来若需发布 wheel 再恢复包名
only-include = [
  "main.py",
  "routes.py",
  "schemas.py",
  "chunking.py",
  "extractors",
  "agents",
]

[tool.pytest.ini_options]
pythonpath = ["."]

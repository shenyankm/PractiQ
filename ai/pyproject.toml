[project]
name = "openwook-ai"
version = "0.1.0"
description = "OpenWook internal AI service"
requires-python = ">=3.14"
dependencies = [
  "fastapi==0.139.0",
  "uvicorn==0.51.0",
  "pydantic==2.13.4",
  "mammoth==1.12.0",
  "langgraph==1.2.9",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openwook_ai"]
